{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<h2>Welcome back</h2>
<p class="muted">Log in to access your secure files.</p>
<form method="post" class="form" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ request.form.get('email','') }}" required autocomplete="email" placeholder="you@example.com">
  </label>
  <label class="field">
    <span>Password</span>
    <div class="pw-wrap">
      <input type="password" name="password" id="pw" required autocomplete="current-password" placeholder="Your password">
      <button type="button" class="pw-toggle" data-target="pw">Show</button>
    </div>
  </label>
  <div class="form-row"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
  <button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
<p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
